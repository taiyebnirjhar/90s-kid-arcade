# Publishes the website (site/) to GitHub Pages whenever it changes on main,
# and again after each new APK build, with that APK beside the page: the
# Download button then starts the download straight from the site, without
# GitHub's short-lived download links (which a browser's retry can't reuse).
# Needs Pages turned on once: repo Settings → Pages → Source: GitHub Actions.
name: Website

on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/pages.yml"]
  workflow_run:
    workflows: ["Android APK"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    # After an APK build: only when it built (and published) one.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: The latest APK, served by the site
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download latest --pattern 90s-Kid-Arcade.apk --dir site --clobber
      - name: What version the site serves (the app checks it, to offer the update)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The newest numbered release (v1.0.<run>): its number, and its "What's new" lines.
          tag=$(gh release list --limit 30 --json tagName,createdAt --jq '[.[] | select(.tagName | startswith("v1."))] | sort_by(.createdAt) | reverse | .[0].tagName // ""')
          if [ -z "$tag" ]; then echo "No numbered release yet: no version.json"; exit 0; fi
          gh release view "$tag" --json body --jq .body > "$RUNNER_TEMP/notes.md"
          TAG="$tag" python3 - <<'PY'
          import json, os, re
          tag = os.environ["TAG"]
          name = tag[1:]
          lines = open(os.environ["RUNNER_TEMP"] + "/notes.md").read().splitlines()
          new = lines[lines.index("### What's new") + 1:] if "### What's new" in lines else []
          notes = [re.sub(r" \(#\d+\)$", "", l[2:]).strip() for l in new if l.startswith("- ")][:6]
          json.dump({
              "code": int(name.split(".")[-1]),
              "name": name,
              "notes": notes,
              "apk": "https://arcade.taiyebnirjhor.com/90s-Kid-Arcade.apk",
          }, open("site/version.json", "w"), indent=1)
          print(open("site/version.json").read())
          PY
      - name: Download count, baked in (shown even where the page can't reach GitHub)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n=$(gh api "repos/${{ github.repository }}/releases?per_page=100" \
                --jq '[.[].assets[].download_count] | add // 0' || echo 0)
          echo "GitHub release downloads: $n"
          if [ "${n:-0}" -gt 0 ] 2>/dev/null; then
            sed -i "s#<li id=\"live-downloads\" data-github=\"0\" hidden><b>0</b>#<li id=\"live-downloads\" data-github=\"$n\"><b>$n</b>#" site/index.html
            grep -n 'live-downloads"' site/index.html
          fi
      - name: The link preview card, with the games' pictures (none kept in the repo)
        # Rendered from share-card.html by the runner's Chrome: libretro's thumbnails are
        # fetched now. If it can't be made, the app's old screenshot stands in.
        run: |
          google-chrome --headless=new --no-sandbox --hide-scrollbars --disable-gpu \
            --window-size=1200,630 --virtual-time-budget=20000 \
            --screenshot="$PWD/site/img/share.png" "file://$PWD/site/share-card.html" \
            && test -s site/img/share.png \
            || cp site/img/home.png site/img/share.png
          # A small JPEG too (WhatsApp and others skip preview images over ~300 KB);
          # if it can't be made, the pages point at the PNG instead.
          if python3 -m pip install --quiet --break-system-packages pillow && \
             python3 -c "from PIL import Image; Image.open('site/img/share.png').convert('RGB').save('site/img/share.jpg', quality=82, optimize=True)"; then
            ls -la site/img/
          else
            sed -i 's#img/share.jpg#img/share.png#g; s#image/jpeg#image/png#g' site/index.html site/join.html
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
