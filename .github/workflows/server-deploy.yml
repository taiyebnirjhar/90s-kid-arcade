# Puts the online server (server/supabase) on the Supabase project when it
# changes on main: the database migrations, then the Edge Functions.
# Waits for three repo secrets (Settings -> Secrets and variables -> Actions;
# docs/online-setup.md): SUPABASE_ACCESS_TOKEN, SUPABASE_PROJECT_REF and
# SUPABASE_DB_PASSWORD. Without them it says so and does nothing.
name: Server deploy

on:
  push:
    branches: [main]
    paths: ["server/supabase/**", ".github/workflows/server-deploy.yml"]
  workflow_dispatch:

concurrency:
  group: server-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - name: Set up?
        id: ready
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_REF" ] || [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::notice::Not deployed: add SUPABASE_ACCESS_TOKEN, SUPABASE_PROJECT_REF and SUPABASE_DB_PASSWORD as repo secrets (docs/online-setup.md)."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.ready.outputs.ok == 'true'
      - uses: supabase/setup-cli@v1
        if: steps.ready.outputs.ok == 'true'
        with:
          version: latest
      - name: Database
        if: steps.ready.outputs.ok == 'true'
        working-directory: server
        run: |
          supabase link --project-ref "$SUPABASE_PROJECT_REF"
          # --remote: the project linked above (newer CLIs push to a local stack unless
          # told); --yes: CI can't answer the "apply N migrations?" prompt.
          supabase db push --remote --yes
      - name: Functions
        if: steps.ready.outputs.ok == 'true'
        working-directory: server
        # --yes for a CLI that asks to confirm; one that doesn't know it deploys without.
        run: |
          supabase functions deploy turn-credentials --project-ref "$SUPABASE_PROJECT_REF" --yes \
            || supabase functions deploy turn-credentials --project-ref "$SUPABASE_PROJECT_REF"
