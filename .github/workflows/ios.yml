# The iPhone side: builds the shared core (android/core, Kotlin
# Multiplatform) for iOS on a Mac, so code that only works on Android
# never slips into the shared part.
name: iOS

on:
  push:
    branches: [main, "claude/**"]
    paths: ["android/core/**", "ios/**", ".github/workflows/ios.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  core:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build the shared core for iPhone
        run: ./gradlew -p core compileKotlinIosArm64 compileKotlinIosSimulatorArm64 --no-daemon

      # The room code (multiplayer) on iPhone's own sockets and threads.
      - name: Test the shared core on an iPhone simulator
        run: ./gradlew -p core iosSimulatorArm64Test --no-daemon
