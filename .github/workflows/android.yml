# Builds the Android app (APK) on every push that touches it.
#
# - Tests the move engine (android/core).
# - Downloads the FBNeo libretro core for Android from the libretro buildbot.
# - Builds a debug APK, uploads it as a workflow artifact, and on main
#   publishes it as the "latest" release so it can be downloaded on a phone.
name: Android APK

on:
  push:
    branches: [main, "claude/**"]
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  # A newer push replaces a branch build; on main, builds queue instead, so a
  # release is never cut off half-published.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
        with:
          # LibretroDroid's native code pulls in oboe and libretro-common.
          submodules: recursive

      # oboe ships sample apps with their own Gradle wrappers, one of which
      # fails setup-gradle's wrapper check. Only its library is built here.
      - name: Drop oboe's sample apps
        run: rm -rf libretrodroid/src/main/cpp/oboe/apps libretrodroid/src/main/cpp/oboe/samples libretrodroid/src/main/cpp/oboe/tests

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Test the move engine
        run: ./gradlew -p core test --no-daemon

      - name: Download the FBNeo core
        run: |
          for abi in arm64-v8a armeabi-v7a; do
            dir=app/src/main/jniLibs/$abi
            mkdir -p "$dir"
            curl -fsSL --retry 3 -o /tmp/fbneo.zip \
              "https://buildbot.libretro.com/nightly/android/latest/$abi/fbneo_libretro_android.so.zip"
            unzip -o -j /tmp/fbneo.zip -d "$dir"
            # Android only installs native libraries named lib*.so.
            mv "$dir/fbneo_libretro_android.so" "$dir/libfbneo_libretro_android.so"
          done
          ls -la app/src/main/jniLibs/*

      - name: Build the APK
        run: |
          ./gradlew :app:assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk 90s-Kid-Arcade.apk

      - uses: actions/upload-artifact@v4
        with:
          name: 90s-Kid-Arcade-apk
          path: android/90s-Kid-Arcade.apk

      - name: Publish to the "latest" release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="Built from ${GITHUB_SHA::7}. Download 90s-Kid-Arcade.apk on your phone and open it to install."
          if gh release view latest >/dev/null 2>&1; then
            # In place: the release is never missing, even for a moment.
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/latest" -f sha="$GITHUB_SHA" -F force=true
            gh release upload latest 90s-Kid-Arcade.apk --clobber
            gh release edit latest --latest --title "90s Kid Arcade (latest build)" --notes "$notes"
          else
            gh release create latest 90s-Kid-Arcade.apk --latest --target "$GITHUB_SHA" \
              --title "90s Kid Arcade (latest build)" --notes "$notes"
          fi

      # Screenshots of the app's screens (Paparazzi, app/src/test), published
      # to a ui-snapshots-<branch> branch to check the look without a phone. Never
      # holds up the APK.
      # A real game screen behind the in-game screenshots (pause, controls):
      # libretro's KOF '97 thumbnail, into build/ (never committed). Without
      # it the tests draw a plain stand-in.
      - name: Download a game screen for the in-game screenshots
        if: github.ref != 'refs/heads/main'
        continue-on-error: true
        run: |
          mkdir -p app/build/test-art
          curl -fsSL --retry 3 -o app/build/test-art/kof97_snap.png \
            "https://raw.githubusercontent.com/libretro-thumbnails/FBNeo_-_Arcade_Games/master/Named_Snaps/The%20King%20of%20Fighters%20'97%20(NGM-2320).png"

      - name: Render UI screenshots
        if: github.ref != 'refs/heads/main'
        continue-on-error: true
        run: ./gradlew :app:recordPaparazziDebug --no-daemon

      - name: Publish UI screenshots
        if: github.ref != 'refs/heads/main'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shots=app/src/test/snapshots/images
          [ -d "$shots" ] || { echo "no screenshots"; exit 0; }
          out=$(mktemp -d)
          cp "$shots"/*.png "$out"/
          cd "$out"
          # One screenshots branch per branch, so branches built side by side don't overwrite each other's.
          target="ui-snapshots-${GITHUB_REF_NAME//\//-}"
          git init -q -b "$target"
          git add .
          git -c user.name="ci" -c user.email="ci@users.noreply.github.com" commit -qm "UI screenshots of ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$target"
