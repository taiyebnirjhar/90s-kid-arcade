# The online server's tests (server/): the database's rules on Postgres 16,
# the relay function's rules in Node, and its Deno code checked.
name: Server

on:
  push:
    branches: [main, "claude/**"]
    paths: ["server/**", ".github/workflows/server.yml"]
  pull_request:
    paths: ["server/**", ".github/workflows/server.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.1.4
      - name: Check the function's Deno code
        working-directory: server/supabase/functions/turn-credentials
        run: |
          deno check index.ts
          deno lint index.ts relay.ts
      - name: Tests
        env:
          PGURL: postgresql://postgres:test@localhost:5432/postgres
        run: server/test.sh
