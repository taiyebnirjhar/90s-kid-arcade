<!doctype html>
<!-- The Facebook page cover, 1640 x 624 (twice Facebook's 820 x 312).
     The Facebook app on phones shows only about the middle 900 px and puts
     the round profile picture over the bottom middle, so the words sit
     centred in the top part; game title screens fill both sides (fetched
     from libretro's thumbnails when rendered, never kept in the repo). -->
<html lang="en"><head><meta charset="utf-8"><title>90s Kid Arcade · video banner</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@1,700;1,900&family=Roboto:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root { --bg:#0B0B12; --panel:#171724; --line:#2C2C40; --text:#F1F0F7; --gold:#E8B21A; }
  * { box-sizing:border-box; margin:0; }
  html,body { width:1920px; height:1080px; overflow:hidden; background:var(--bg); }
  body { position:relative; font-family:Roboto,Arial,sans-serif; color:var(--text); }
  .wall { position:absolute; left:-120px; right:-120px; top:-140px; bottom:-140px; transform:rotate(-7deg);
    display:grid; grid-template-columns:repeat(6,1fr); gap:18px; align-content:center; }
  .card { border-radius:16px; overflow:hidden; border:1px solid var(--line); background:#000; aspect-ratio:4/3; }
  .card:nth-child(even) { transform:translateY(46px); }
  /* Old title screens are small: drawn in sharp pixels, not smoothed. */
  .card img { width:100%; height:100%; object-fit:cover; display:block; image-rendering:pixelated; }
  .shade { position:absolute; inset:0; background:
     radial-gradient(42% 62% at 50% 45%, rgba(11,11,18,.97) 40%, rgba(11,11,18,.82) 70%, rgba(11,11,18,.45) 100%),
     linear-gradient(rgba(11,11,18,.25), rgba(11,11,18,.25)); }
  .glow { position:absolute; inset:0; background:radial-gradient(30% 50% at 50% 45%, rgba(232,178,26,.16), transparent 70%); }
  .mid { position:absolute; left:0; right:0; top:150px; text-align:center; }
  .logo { font:italic 900 64px/1 'Barlow Condensed',sans-serif; text-transform:uppercase; letter-spacing:.5px; }
  .logo b { color:var(--gold); }
  .gameon { margin-top:8px; font:italic 900 230px/.86 'Barlow Condensed',sans-serif; text-transform:uppercase;
    background:linear-gradient(#FFD45A, var(--gold) 55%, #B8860B); -webkit-background-clip:text; background-clip:text; color:transparent;
    filter:drop-shadow(0 6px 0 #4a3605); }
  .tag { margin-top:26px; font-size:40px; line-height:1.3; font-weight:500; }
  .tag em { font-style:normal; color:var(--gold); font-weight:700; }
  .feats { margin-top:70px; font:italic 900 64px/1 'Barlow Condensed',sans-serif; text-transform:uppercase; letter-spacing:1px; }
  .url { margin-top:34px; display:inline-block; padding:18px 40px; border-radius:99px; background:var(--gold); color:#1a1405; font:700 46px Roboto,sans-serif; }
</style></head><body>
  <div class="wall"><div class="card"><img src="https://raw.githubusercontent.com/libretro-thumbnails/FBNeo_-_Arcade_Games/master/Named_Titles/The%20King%20of%20Fighters%20%2797%20%28NGM-2320%29.png" alt=""></div><div class="card"><img src="https://raw.githubusercontent.com/libretro-thumbnails/FBNeo_-_Arcade_Games/master/Named_Titles/Metal%20Slug%20X%20-%20Super%20Vehicle-001%20%28NGM-2500%20~%20NGH-2500%29.png" alt=""></div><div class="card"><img src="https://raw.githubusercontent.com/libretro-thumbnails/FBNeo_-_Arcade_Games/master/Named_Titles/The%20King%20of%20Fighters%202002%20%28NGM-2650%20~%20NGH-2650%29.png" alt=""></div><div class="card"><img src="https://raw.githubusercontent.com/libretro-thumbnails/FBNeo_-_Arcade_Games/master/Named_Titles/Cadillacs%20and%20Dinosaurs%20%28World%20930201%29.png" alt=""></div><div class="card"><img src="https://raw.githubusercontent.com/libretro-thumbnails/FBNeo_-_Arcade_Games/master/Named_Titles/Marvel%20Vs.%20Capcom_%20Clash%20of%20Super%20Heroes%20%28Europe%20980123%29.png" alt=""></div><div class="card"><img src="https://raw.githubusercontent.com/libretro-thumbnails/FBNeo_-_Arcade_Games/master/Named_Titles/Metal%20Slug%203%20%28NGM-2560%29.png" alt=""></div><div class="card"><img src="https://raw.githubusercontent.com/libretro-thumbnails/FBNeo_-_Arcade_Games/master/Named_Titles/Cadillacs%20and%20Dinosaurs%20%28World%20930201%29.png" alt=""></div><div class="card"><img src="https://raw.githubusercontent.com/libretro-thumbnails/FBNeo_-_Arcade_Games/master/Named_Titles/Marvel%20Vs.%20Capcom_%20Clash%20of%20Super%20Heroes%20%28Europe%20980123%29.png" alt=""></div><div class="card"><img src="https://raw.githubusercontent.com/libretro-thumbnails/FBNeo_-_Arcade_Games/master/Named_Titles/Metal%20Slug%203%20%28NGM-2560%29.png" alt=""></div><div class="card"><img src="https://raw.githubusercontent.com/libretro-thumbnails/FBNeo_-_Arcade_Games/master/Named_Titles/The%20King%20of%20Fighters%20%2797%20%28NGM-2320%29.png" alt=""></div><div class="card"><img src="https://raw.githubusercontent.com/libretro-thumbnails/FBNeo_-_Arcade_Games/master/Named_Titles/Metal%20Slug%20X%20-%20Super%20Vehicle-001%20%28NGM-2500%20~%20NGH-2500%29.png" alt=""></div><div class="card"><img src="https://raw.githubusercontent.com/libretro-thumbnails/FBNeo_-_Arcade_Games/master/Named_Titles/The%20King%20of%20Fighters%202002%20%28NGM-2650%20~%20NGH-2650%29.png" alt=""></div></div>

</body></html>
