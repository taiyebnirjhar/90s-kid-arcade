<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@1,800;1,900&display=swap" rel="stylesheet">
<style>
html,body{margin:0;width:1080px;height:1080px;overflow:hidden;background:#0B0B12}
body{position:relative;font-family:'Barlow Condensed',sans-serif;font-style:italic;text-transform:uppercase}
.glow{position:absolute;inset:0;background:radial-gradient(48% 48% at 50% 50%,rgba(232,178,26,.28),transparent 72%)}
.ring{position:absolute;left:90px;top:90px;width:900px;height:900px;border-radius:50%;border:10px solid rgba(232,178,26,.55);box-sizing:border-box}
.scan{position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(255,255,255,.025) 0 3px,transparent 3px 6px)}
.n{position:absolute;left:0;right:0;top:250px;text-align:center;font-weight:900;font-size:470px;line-height:.86;letter-spacing:-6px;
 background:linear-gradient(#FFE07A,#E8B21A 55%,#B8860B);-webkit-background-clip:text;color:transparent;filter:drop-shadow(0 14px 0 #5a4206)}
.t{position:absolute;left:0;right:0;top:690px;text-align:center;font-weight:900;font-size:104px;color:#F1F0F7;letter-spacing:2px}
</style></head><body>
<div class="glow"></div><div class="scan"></div><div class="ring"></div>
<div class="n">90s</div><div class="t">Kid Arcade</div>
</body></html>
